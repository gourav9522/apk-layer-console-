<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApkLayer Console - Direct Publisher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gold-glow { text-shadow: 0 0 15px rgba(234, 179, 8, 0.4); }
        .emerald-border { border-color: rgba(16, 185, 129, 0.3); }
        .emerald-border:focus { border-color: #10b981; box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900/90 backdrop-blur-md p-6 rounded-3xl border emerald-border shadow-2xl my-6 relative overflow-hidden">
        
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-xl font-extrabold text-emerald-400 gold-glow">ApkLayer Console</h1>
                <p class="text-xs text-amber-300/80 font-medium">Smart Direct Publisher</p>
            </div>
            <a href="https://apklayer.sbs/" target="_blank" class="px-3.5 py-1.5 bg-emerald-950/60 border emerald-border rounded-xl text-xs font-bold text-emerald-300">Visit Store</a>
        </div>

        <form id="uploadForm" onsubmit="publishApp(event)" class="space-y-4">
            <div>
                <label class="block text-[11px] uppercase tracking-wider text-amber-400/90 font-bold mb-1">App Name</label>
                <input type="text" id="appName" required class="w-full p-3 rounded-xl bg-slate-950 border emerald-border text-white text-sm focus:outline-none" placeholder="Esports-rdx">
            </div>
            <div>
                <label class="block text-[11px] uppercase tracking-wider text-amber-400/90 font-bold mb-1">Package Name</label>
                <input type="text" id="packageName" required class="w-full p-3 rounded-xl bg-slate-950 border emerald-border text-white text-sm focus:outline-none" placeholder="esportsrdx.apliclyy">
            </div>
            <div>
                <label class="block text-[11px] uppercase tracking-wider text-amber-400/90 font-bold mb-1">Version</label>
                <input type="text" id="version" required class="w-full p-3 rounded-xl bg-slate-950 border emerald-border text-white text-sm focus:outline-none" placeholder="0.27.0">
            </div>
            <div>
                <label class="block text-[11px] uppercase tracking-wider text-amber-400/90 font-bold mb-1">App Description</label>
                <textarea id="appDesc" rows="2" required class="w-full p-3 rounded-xl bg-slate-950 border emerald-border text-white text-sm resize-none focus:outline-none" placeholder="Free fire tournament win cash prize..."></textarea>
            </div>
            <div>
                <label class="block text-[11px] uppercase tracking-wider text-amber-400/90 font-bold mb-1">App Logo Image (Select from Phone)</label>
                <input type="file" id="logoFile" accept="image/*" required class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-emerald-600 file:text-white file:font-bold file:cursor-pointer">
            </div>
            <div>
                <label class="block text-[11px] uppercase tracking-wider text-amber-400/90 font-bold mb-1">App Screenshots (Select Multiple)</label>
                <input type="file" id="screenshotFiles" accept="image/*" multiple required class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-amber-600 file:text-white file:font-bold file:cursor-pointer">
            </div>
            <div>
                <label class="block text-[11px] uppercase tracking-wider text-amber-400/90 font-bold mb-1">APK Direct Download Link (Archive.org etc.)</label>
                <input type="url" id="apkUrl" required class="w-full p-3 rounded-xl bg-slate-950 border emerald-border text-white text-sm focus:outline-none mb-2" placeholder="https://archive.org/download/.../file.apk">
            </div>
            <div>
                <label class="block text-[11px] uppercase tracking-wider text-amber-400/90 font-bold mb-1">File Size</label>
                <input type="text" id="fileSize" required class="w-full p-3 rounded-xl bg-slate-950 border emerald-border text-white text-sm focus:outline-none" placeholder="35 MB">
            </div>

            <button type="submit" id="subBtn" class="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-amber-600 rounded-2xl font-extrabold text-sm text-white cursor-pointer">🚀 Publish App Globally</button>
        </form>

        <div id="resultBox" class="hidden mt-6 p-4 bg-slate-950 rounded-2xl border emerald-border text-center space-y-3">
            <p class="text-xs text-emerald-400 font-bold">✅ App Live Worldwide!</p>
            <input type="text" id="shareLink" readonly class="w-full p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs text-slate-300 text-center select-all">
            <button onclick="copyLink()" class="w-full py-2.5 bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600 rounded-xl text-xs font-bold border border-emerald-500/30">Copy Link</button>
        </div>
        <p id="status" class="mt-4 text-center text-xs font-medium"></p>
    </div>

    <script>
        const FIREBASE_DB_URL = "https://apk-layer-default-rtdb.firebaseio.com/apps";

        async function uploadImageToHost(file) {
            const formData = new FormData();
            formData.append('reqtype', 'fileupload');
            formData.append('fileToUpload', file);
            
            const response = await fetch('https://catbox.moe/user/api.php', {
                method: 'POST',
                body: formData
            });
            if (!response.ok) throw new Error("Image upload failed");
            return await response.text();
        }

        async function publishApp(e) {
            e.preventDefault();
            const btn = document.getElementById('subBtn');
            const status = document.getElementById('status');
            const resultBox = document.getElementById('resultBox');
            
            const appName = document.getElementById('appName').value.trim();
            const packageName = document.getElementById('packageName').value.toLowerCase().replace(/[^a-z0-9_.]/g, '');
            const version = document.getElementById('version').value.trim();
            const description = document.getElementById('appDesc').value.trim();
            const logoFile = document.getElementById('logoFile').files[0];
            const screenshotFiles = document.getElementById('screenshotFiles').files;
            const apkUrl = document.getElementById('apkUrl').value.trim();
            const fileSize = document.getElementById('fileSize').value.trim();

            btn.disabled = true;
            status.innerText = "Uploading images and publishing...";
            resultBox.classList.add('hidden');

            try {
                // Logo upload
                status.innerText = "Uploading Logo...";
                const logoUrl = await uploadImageToHost(logoFile);

                // Screenshots upload
                status.innerText = "Uploading Screenshots...";
                let screenshotsUrls = [];
                for (let i = 0; i < screenshotFiles.length; i++) {
                    const sUrl = await uploadImageToHost(screenshotFiles[i]);
                    screenshotsUrls.push(sUrl);
                }

                // Save to Firebase
                status.innerText = "Saving to Firebase Database...";
                const appId = Date.now().toString();

                const newAppObj = {
                    id: appId,
                    appName: appName,
                    packageName: packageName,
                    version: version,
                    description: description,
                    logoUrl: logoUrl,
                    screenshots: screenshotsUrls,
                    archiveUrl: apkUrl,
                    size: fileSize
                };

                const res = await fetch(`${FIREBASE_DB_URL}/${appId}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newAppObj)
                });

                if (!res.ok) throw new Error("Failed to save on Firebase");

                const appShareLink = `https://apklayer.sbs/#app=${appId}`;
                document.getElementById('shareLink').value = appShareLink;
                resultBox.classList.remove('hidden');
                status.innerText = "";
                document.getElementById('uploadForm').reset();

            } catch (err) {
                console.error("Error:", err);
                status.innerText = "❌ Error: " + err.message;
                status.className = "mt-4 text-center text-xs font-medium text-red-400";
            }

            btn.disabled = false;
        };

        function copyLink() {
            const copyText = document.getElementById('shareLink');
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert('Link copied!');
        }
    </script>
</body>
</html>
