<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApkLayer Console - Premium Publisher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        .gold-glow { text-shadow: 0 0 15px rgba(234, 179, 8, 0.4); }
        .emerald-border { border-color: rgba(16, 185, 129, 0.3); }
        .emerald-border:focus { border-color: #10b981; box-shadow: 0 0 10px rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900/90 backdrop-blur-md p-6 rounded-3xl border emerald-border shadow-2xl my-6 relative overflow-hidden">
        
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-xl font-extrabold text-emerald-400 gold-glow">ApkLayer Console</h1>
                <p class="text-xs text-amber-300/80 font-medium">Cloud Publisher</p>
            </div>
            <a href="https://apklayer.sbs/" target="_blank" class="px-3.5 py-1.5 bg-emerald-950/60 border emerald-border rounded-xl text-xs font-bold text-emerald-300">Visit Store</a>
        </div>

        <form id="uploadForm" onsubmit="uploadApp(event)" class="space-y-4">
            <div>
                <label class="block text-[11px] uppercase tracking-wider text-amber-400/90 font-bold mb-1">App Name</label>
                <input type="text" id="appName" required class="w-full p-3 rounded-xl bg-slate-950 border emerald-border text-white text-sm focus:outline-none" placeholder="Subway Surfers Mod">
            </div>
            <div>
                <label class="block text-[11px] uppercase tracking-wider text-amber-400/90 font-bold mb-1">Package Name</label>
                <input type="text" id="packageName" required class="w-full p-3 rounded-xl bg-slate-950 border emerald-border text-white text-sm focus:outline-none" placeholder="com.kiloo.subwaysurf">
            </div>
            <div>
                <label class="block text-[11px] uppercase tracking-wider text-amber-400/90 font-bold mb-1">Version</label>
                <input type="text" id="version" required class="w-full p-3 rounded-xl bg-slate-950 border emerald-border text-white text-sm focus:outline-none" placeholder="3.0.0">
            </div>
            <div>
                <label class="block text-[11px] uppercase tracking-wider text-amber-400/90 font-bold mb-1">App Description</label>
                <textarea id="appDesc" rows="2" required class="w-full p-3 rounded-xl bg-slate-950 border emerald-border text-white text-sm resize-none focus:outline-none" placeholder="Write features..."></textarea>
            </div>
            <div>
                <label class="block text-[11px] uppercase tracking-wider text-amber-400/90 font-bold mb-1">App Logo Image URL</label>
                <input type="url" id="logoUrlInput" required class="w-full p-3 rounded-xl bg-slate-950 border emerald-border text-white text-sm focus:outline-none" placeholder="https://... (Logo Direct Link)">
            </div>
            <div>
                <label class="block text-[11px] uppercase tracking-wider text-amber-400/90 font-bold mb-1">App Screenshots URLs (Comma separated)</label>
                <textarea id="screenshotsInput" rows="2" required class="w-full p-3 rounded-xl bg-slate-950 border emerald-border text-white text-sm resize-none focus:outline-none" placeholder="https://link1.jpg, https://link2.jpg"></textarea>
            </div>
            <div>
                <label class="block text-[11px] uppercase tracking-wider text-amber-400/90 font-bold mb-1">APK File OR Direct Link</label>
                <input type="file" id="apkFile" accept=".apk" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-blue-600 file:text-white file:font-bold file:cursor-pointer mb-2">
                <input type="url" id="directDownloadUrl" placeholder="Or Paste Direct URL (https://...)" class="w-full p-3 rounded-xl bg-slate-950 border emerald-border text-white text-sm focus:outline-none mb-2">
                <input type="text" id="manualFileSize" placeholder="Enter File Size manually (e.g. 1.2 GB, 450 MB)" class="w-full p-3 rounded-xl bg-slate-950 border emerald-border text-white text-sm focus:outline-none">
            </div>

            <!-- Live Progress Box -->
            <div id="progressContainer" class="hidden text-center py-4 bg-slate-950 rounded-2xl border emerald-border space-y-2">
                <p id="progressText" class="text-xs text-amber-400 font-bold">Uploading APK to Telegram...</p>
                <div class="w-full bg-slate-800 rounded-full h-2.5 my-2">
                    <div id="progressBar" class="bg-emerald-500 h-2.5 rounded-full" style="width: 0%"></div>
                </div>
                <p id="percentageText" class="text-sm text-emerald-400 font-mono font-bold">0% Uploaded</p>
            </div>

            <button type="submit" id="subBtn" class="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-amber-600 rounded-2xl font-extrabold text-sm text-white cursor-pointer">🚀 Publish App Globally</button>
        </form>

        <div id="resultBox" class="hidden mt-6 p-4 bg-slate-950 rounded-2xl border emerald-border text-center space-y-3">
            <p class="text-xs text-emerald-400 font-bold">✅ App Live Worldwide!</p>
            <input type="text" id="shareLink" readonly class="w-full p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs text-slate-300 text-center select-all">
            <button onclick="copyLink()" class="w-full py-2.5 bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600 rounded-xl text-xs font-bold border border-emerald-500/30">Copy Link</button>
        </div>
        <p id="status" class="mt-4 text-center text-xs font-medium"></p>
    </div>

    <script>
        const FIREBASE_DB_URL = "https://apk-layer-default-rtdb.firebaseio.com/apps";
        const RENDER_SERVER_URL = "https://download-link-server.onrender.com";

        async function uploadApp(e) {
            e.preventDefault();
            const btn = document.getElementById('subBtn');
            const status = document.getElementById('status');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const percentageText = document.getElementById('percentageText');
            const resultBox = document.getElementById('resultBox');
            
            const appName = document.getElementById('appName').value.trim();
            const packageName = document.getElementById('packageName').value.toLowerCase().replace(/[^a-z0-9_.]/g, '');
            const version = document.getElementById('version').value.trim();
            const description = document.getElementById('appDesc').value.trim();
            const logoUrl = document.getElementById('logoUrlInput').value.trim();
            const screenshotsText = document.getElementById('screenshotsInput').value.trim();
            const apkFile = document.getElementById('apkFile').files[0];
            const directUrl = document.getElementById('directDownloadUrl').value.trim();
            const manualSize = document.getElementById('manualFileSize').value.trim();

            if (!apkFile && !directUrl) return alert('Select APK file or Direct URL!');

            btn.disabled = true;
            status.innerText = "";
            resultBox.classList.add('hidden');

            let finalDownloadUrl = directUrl;

            try {
                if (apkFile) {
                    progressContainer.classList.remove('hidden');
                    const formData = new FormData();
                    formData.append('apkFile', apkFile);

                    const res = await axios.post(`${RENDER_SERVER_URL}/api/upload-apk`, formData, {
                        headers: { 'Content-Type': 'multipart/form-data' },
                        onUploadProgress: function (event) {
                            if (event.lengthComputable) {
                                let percentComplete = Math.round((event.loaded / event.total) * 100);
                                progressBar.style.width = percentComplete + '%';
                                percentageText.innerText = percentComplete + '% APK Uploaded to Telegram';
                            }
                        }
                    });

                    if (!res.data.success) throw new Error("Telegram upload failed");
                    finalDownloadUrl = res.data.downloadUrl;
                    progressContainer.classList.add('hidden');
                }

                // Screenshots parse karna (comma separated links)
                const screenshotsUrls = screenshotsText.split(',').map(s => s.trim()).filter(s => s.length > 0);

                // Save to Firebase Database & Design Page
                status.innerText = "Registering on Firebase Database...";
                const appId = Date.now().toString();
                let fileSize = apkFile ? (apkFile.size / (1024*1024)).toFixed(1) + ' MB' : (manualSize ? manualSize : "Web Link");

                const newAppObj = {
                    id: appId,
                    appName: appName,
                    packageName: packageName,
                    version: version,
                    description: description,
                    logoUrl: logoUrl,
                    screenshots: screenshotsUrls,
                    archiveUrl: finalDownloadUrl,
                    size: fileSize
                };

                await fetch(`${FIREBASE_DB_URL}/${appId}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newAppObj)
                });

                const appShareLink = `https://apklayer.sbs/#app=${appId}`;
                document.getElementById('shareLink').value = appShareLink;
                resultBox.classList.remove('hidden');
                status.innerText = "";
                document.getElementById('uploadForm').reset();

            } catch (err) {
                console.error("Error:", err);
                status.innerText = "❌ Error: " + (err.response?.data?.error || err.message);
                status.className = "mt-4 text-center text-xs font-medium text-red-400";
                progressContainer.classList.add('hidden');
            }

            btn.disabled = false;
        };

        function copyLink() {
            const copyText = document.getElementById('shareLink');
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert('Link copied!');
        }
    </script>
</body>
</html>
