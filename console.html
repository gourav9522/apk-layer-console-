<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apk Layer Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl my-6">
        
        <div class="mb-4">
            <img src="https://archive.org/download/image_2a884fe73/image_2a884fe7~3.jpg" alt="Apk Layer Banner" class="w-full h-32 object-cover rounded-xl border border-slate-800 shadow-md">
        </div>

        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-xl font-bold text-blue-400">Apk Layer Console</h1>
                <p class="text-xs text-slate-400">Publish Globally via Firebase</p>
            </div>
            <a href="store.html" class="px-3 py-1 bg-slate-950 border border-slate-800 rounded-lg text-xs font-semibold text-slate-300">Visit Store</a>
        </div>

        <form id="uploadForm" onsubmit="uploadApp(event)" class="space-y-4">
            <div>
                <label class="block text-xs uppercase text-slate-400 mb-1">App Name</label>
                <input type="text" id="appName" required class="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm" placeholder="My App">
            </div>
            <div>
                <label class="block text-xs uppercase text-slate-400 mb-1">Package Name</label>
                <input type="text" id="packageName" required class="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm" placeholder="com.app.tool">
            </div>
            <div>
                <label class="block text-xs uppercase text-slate-400 mb-1">Version</label>
                <input type="text" id="version" required class="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm" placeholder="1.0">
            </div>
            <div>
                <label class="block text-xs uppercase text-slate-400 mb-1">App Description</label>
                <textarea id="appDesc" rows="2" required class="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm resize-none" placeholder="Description..."></textarea>
            </div>
            <div>
                <label class="block text-xs uppercase text-slate-400 mb-1">App Logo Image</label>
                <input type="file" id="logoFile" accept="image/*" required class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-slate-800 file:text-white file:font-semibold">
            </div>
            <div>
                <label class="block text-xs uppercase text-slate-400 mb-1">APK File OR Direct Link</label>
                <input type="file" id="apkFile" accept=".apk" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-600 file:text-white file:font-semibold mb-2">
                <input type="url" id="directDownloadUrl" placeholder="Or Paste Direct URL (https://...)" class="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm">
            </div>

            <div id="progressContainer" class="hidden text-center py-3 bg-slate-950 rounded-xl border border-slate-800 space-y-1">
                <p id="progressText" class="text-xs text-amber-400 font-bold">Uploading Files to Cloud...</p>
                <p id="timerText" class="text-xs text-slate-400 font-mono">Please wait...</p>
            </div>

            <button type="submit" id="subBtn" class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold text-sm transition">
                Publish App Globally
            </button>
        </form>

        <div id="resultBox" class="hidden mt-6 p-4 bg-slate-950 rounded-xl border border-slate-800 text-center space-y-3">
            <p class="text-xs text-green-400 font-bold">✅ App Live Worldwide for Everyone!</p>
            <input type="text" id="shareLink" readonly class="w-full p-2.5 rounded-lg bg-slate-900 border border-slate-800 text-xs text-slate-300 text-center select-all">
            <div class="flex gap-2">
                <button onclick="copyLink()" class="flex-1 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-semibold">Copy Link</button>
                <a id="openLinkBtn" href="#" target="_blank" class="flex-1 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-xs font-semibold text-center">Open Store</a>
            </div>
        </div>

        <p id="status" class="mt-4 text-center text-xs font-medium"></p>
    </div>

    <script>
        const IA_ACCESS_KEY = "OLmzxUOSjra7c5Mh";
        const IA_SECRET_KEY = "jyyV5luXiOGFzTCX";
        const FIREBASE_DB_URL = "https://apk-layer-default-rtdb.firebaseio.com/apps";

        async function uploadApp(e) {
            e.preventDefault();
            const btn = document.getElementById('subBtn');
            const status = document.getElementById('status');
            const progressContainer = document.getElementById('progressContainer');
            const resultBox = document.getElementById('resultBox');
            
            const appName = document.getElementById('appName').value.trim();
            const packageName = document.getElementById('packageName').value.toLowerCase().replace(/[^a-z0-9_.]/g, '');
            const version = document.getElementById('version').value.trim();
            const description = document.getElementById('appDesc').value.trim();
            const logoFile = document.getElementById('logoFile').files[0];
            const apkFile = document.getElementById('apkFile').files[0];
            const directUrl = document.getElementById('directDownloadUrl').value.trim();

            if (!logoFile) return alert('Select Logo image!');
            if (!apkFile && !directUrl) return alert('Select APK file or Direct URL!');

            btn.disabled = true;
            status.innerText = "";
            resultBox.classList.add('hidden');
            progressContainer.classList.remove('hidden');

            try {
                const appId = Date.now().toString();
                const identifier = `apklayer-${packageName.replace(/\./g, '_')}-${appId}`;
                
                status.innerText = "Uploading Logo to Cloud...";
                await fetch(`https://s3.us.archive.org/${identifier}/logo.png`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `LOW ${IA_ACCESS_KEY}:${IA_SECRET_KEY}`,
                        'Content-Type': logoFile.type,
                        'x-archive-auto-make-bucket': '1'
                    },
                    body: logoFile
                });
                const logoUrl = `https://archive.org/download/${identifier}/logo.png`;

                let archiveDownloadUrl = "";
                let fileSize = "Web Link";

                if (apkFile) {
                    status.innerText = "Uploading APK File...";
                    await fetch(`https://s3.us.archive.org/${identifier}/${apkFile.name}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `LOW ${IA_ACCESS_KEY}:${IA_SECRET_KEY}`,
                            'Content-Type': 'application/vnd.android.package-archive'
                        },
                        body: apkFile
                    });
                    archiveDownloadUrl = `https://archive.org/download/${identifier}/${apkFile.name}`;
                    fileSize = (apkFile.size / (1024*1024)).toFixed(1) + ' MB';
                } else {
                    archiveDownloadUrl = directUrl;
                }

                status.innerText = "Registering on Global Server...";
                const newAppObj = {
                    id: appId,
                    appName: appName,
                    packageName: packageName,
                    version: version,
                    description: description,
                    logoUrl: logoUrl,
                    archiveUrl: archiveDownloadUrl,
                    size: fileSize
                };

                await fetch(`${FIREBASE_DB_URL}/${appId}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newAppObj)
                });

                const storeUrl = window.location.href.replace('console.html', 'store.html');
                const appShareLink = `${storeUrl}#app=${appId}`;

                document.getElementById('shareLink').value = appShareLink;
                document.getElementById('openLinkBtn').href = storeUrl;
                resultBox.classList.remove('hidden');
                status.innerText = "";
                document.getElementById('uploadForm').reset();
            } catch (err) {
                status.innerText = "❌ Error: " + err.message;
                status.className = "mt-4 text-center text-xs font-medium text-red-400";
            } finally {
                progressContainer.classList.add('hidden');
                btn.disabled = false;
            }
        }

        function copyLink() {
            const copyText = document.getElementById('shareLink');
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert('Link copied!');
        }
    </script>
</body>
</html>
